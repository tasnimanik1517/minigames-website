<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>if(location.protocol==='http:'){location.replace('https://'+location.host+location.pathname+location.search);}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniGames.website - Play Free Online Mini-Games</title>
  <meta name="description" content="A collection of fast, free, fun mini-games playable directly in your browser.">
  <link rel="canonical" href="https://minigames.website/">
  <link rel="preload" href="/games.json" as="fetch" type="application/json" crossorigin="anonymous">
  <link rel="stylesheet" href="/assets/shared.css">
  <script src="/assets/shared.js" defer></script>
</head>
<body data-depth="0" data-page="home">

  <header id="site-header" class="site-header">
    <div class="container">
      <a href="/" class="brand-link">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2z"/>
          </svg>
        </span>
        MiniGames.website
      </a>
      <div class="nav-group">
        <div class="search-wrap">
          <input type="search" id="site-search" class="search-input" placeholder="Search games…" autocomplete="off" aria-label="Search games">
          <div id="search-results" class="search-results"></div>
        </div>
        <a href="/all-games/" class="nav-link">All Games</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 class="hero-title">Free Mini-Games — Click and Play</h1>
    </section>

    <section class="games-section">
      <h2 class="section-heading">Popular Games</h2>
      <div id="popular-grid" class="game-grid" aria-live="polite"></div>
    </section>

    <section class="games-section">
      <h2 class="section-heading">New Games</h2>
      <div id="new-grid" class="game-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer">
    <div class="container">
      <span>&copy; <span id="copyright-year">2026</span> MiniGames.website</span>
      <a href="/all-games/" class="footer-link">All Games</a>
    </div>
  </footer>

</body>
</html>
