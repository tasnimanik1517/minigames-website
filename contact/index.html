<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>if(location.protocol==='http:'){location.replace('https://'+location.host+location.pathname+location.search);}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – MiniGames.website</title>
  <meta name="description" content="Get in touch with MiniGames.website.">
  <link rel="canonical" href="https://minigames.website/contact/">
  <link rel="stylesheet" href="../assets/shared.css">
</head>
<body data-depth="1" data-page="contact">

  <header id="site-header" class="site-header">
    <div class="container">
      <a href="../" class="brand-link">MiniGames.website</a>
      <div class="nav-group">
        <div class="search-wrap">
          <input type="search" id="site-search" class="search-input" placeholder="Search games…" autocomplete="off" aria-label="Search games">
          <div id="search-results" class="search-results"></div>
        </div>
        <a href="../all-games/" class="nav-link">All Games</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="game-page-header">
      <a href="../" class="back-link">&larr; Home</a>
    </div>
    <h1 class="game-title">Contact</h1>

    <div class="game-info">
      <p>Questions, bug reports, or a game you'd like to see added — all welcome.</p>
      <p>Email: <a href="mailto:[your-email]@minigames.website">[your-email]@minigames.website</a></p>
    </div>
  </main>

  <footer id="site-footer" class="site-footer">
    <div class="container">
      <div>
        <span>&copy; 2026 MiniGames.website</span>
        <div class="footer-links">
          <a href="../about/" class="footer-link">About</a>
          <a href="../contact/" class="footer-link">Contact</a>
        </div>
      </div>
      <div>
        <div class="subscribe-form">
          <input type="email" id="subscribe-email" class="subscribe-input" placeholder="Your email" aria-label="Your email">
          <button type="button" id="subscribe-btn" class="subscribe-btn">Notify me</button>
        </div>
        <p class="subscribe-note">Get an email when a new game goes up.</p>
      </div>
    </div>
  </footer>

  <script src="../assets/shared.js" defer></script>
</body>
</html>
